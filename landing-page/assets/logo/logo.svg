<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B359" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="#132620" stroke="#00E676" stroke-width="6" />
  <rect x="32" y="32" width="448" height="448" rx="98" fill="none" stroke="#24473C" stroke-width="4" />

  <!-- Motion Score Trajectory Arcs -->
  <path d="M 120 280 A 180 180 0 0 1 420 180" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 150 310 A 140 140 0 0 1 390 220" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Bat Handle & Grip -->
  <line x1="140" y1="380" x2="225" y2="265" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="160" cy="355" r="10" fill="#FF9100"/>
  <circle cx="180" cy="328" r="10" fill="#FF9100"/>
  <circle cx="200" cy="300" r="10" fill="#FF9100"/>

  <!-- Bat Blade -->
  <polygon points="205,290 245,230 365,110 325,370" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="225" y1="260" x2="350" y2="130" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Cricket Ball -->
  <circle cx="350" cy="165" r="75" fill="url(#goldGrad)" stroke="#132620" stroke-width="6" filter="url(#glow)"/>
  <circle cx="330" cy="145" r="22" fill="#FFFFFF" opacity="0.4"/>
  <path d="M 290 195 A 60 60 0 0 1 410 135" fill="none" stroke="#132620" stroke-width="10"/>
  <path d="M 290 195 A 60 60 0 0 1 410 135" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="8 6"/>

  <!-- Star Badge -->
  <polygon points="150,140 156,158 175,158 160,169 165,187 150,176 135,187 140,169 125,158 144,158" fill="#00E676" stroke="#FFD700" stroke-width="2"/>

  <!-- Digital Score Dots -->
  <circle cx="180" cy="420" r="12" fill="#00E676"/>
  <circle cx="225" cy="420" r="12" fill="#00E676"/>
  <circle cx="270" cy="420" r="12" fill="#FFD700"/>
</svg>